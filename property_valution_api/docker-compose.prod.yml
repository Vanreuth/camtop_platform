version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: property_valuation_api_prod
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - .env.production
    depends_on:
      - db
      - redis
    environment:
      - TZ=Asia/Phnom_Penh
      - REDIS_URL=redis://redis:6379/0

  db:
    image: postgres:15-alpine
    container_name: property_valuation_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: property_valuation_redis_prod
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
